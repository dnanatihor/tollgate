[project]
name = "tollgate-review"
version = "0.1.0"
description = "Enterprise-architect-level AI pull request reviewer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tollgate contributors" }]
keywords = ["code-review", "security", "owasp", "architecture", "pull-request", "llm"]
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "jinja2>=3",
    "jsonschema>=4",
    "langchain>=0.3",
    "langchain-openai>=1.6.7",
    "langgraph>=0.2",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "tree-sitter>=0.24",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "typer>=0.12",
    "unidiff>=0.7",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/dnanatihor/tollgate"
Repository = "https://github.com/dnanatihor/tollgate"
Issues = "https://github.com/dnanatihor/tollgate/issues"
Changelog = "https://github.com/dnanatihor/tollgate/blob/main/CHANGELOG.md"

[project.scripts]
tollgate = "tollgate.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.23.1",
    "ruff>=0.6",
    "types-PyYAML",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tollgate"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"standards" = "tollgate/standards_data"
"prompts" = "tollgate/prompts_data"
"prices.yaml" = "tollgate/prices.yaml"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["SPEC.md", "eval/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"eval/build_cases.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tollgate"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q"]
